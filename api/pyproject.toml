[project]
name = "insightforge-api"
version = "0.1.0"
description = "InsightForge analytics API + MCP server"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "python-multipart==0.0.20",
    "sqlalchemy==2.0.36",
    "psycopg[binary]==3.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "authlib==1.4.0",
    "httpx==0.28.1",
    "python-jose[cryptography]==3.3.0",
    "itsdangerous==2.2.0",
    "redis==5.2.1",
    "celery==5.4.0",
    "boto3==1.35.92",
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "scikit-learn==1.6.0",
    "xlsxwriter==3.2.0",
    "mcp==1.12.4",
]

[tool.setuptools.packages.find]
include = ["app*"]
